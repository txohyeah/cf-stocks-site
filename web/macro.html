<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宏观环境 · Stocks 研究站</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
  .mc-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  .mc-panel > h3 { font-size: 15px; margin-bottom: 4px; }
  .mc-kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; margin-top: 12px; }
  .mc-kpi { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; }
  .mc-kpi .k-name { font-size: 12px; color: var(--muted); }
  .mc-kpi .k-val { font-size: 20px; font-weight: 700; margin: 4px 0 2px; }
  .mc-kpi .k-sub { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .mc-up { color: var(--green); } .mc-down { color: var(--red); } .mc-flat { color: var(--muted); }
  .mc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 12px; }
  .mc-chart { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .mc-chart h4 { font-size: 13px; margin-bottom: 6px; color: var(--text); font-weight: 600; }
  .mc-chart svg { width: 100%; height: auto; display: block; }
  .mc-legend { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.7; }
  .mc-legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin: 0 5px 3px 12px; }
  .mc-legend i:first-child { margin-left: 0; }
  .mc-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .mc-table th, .mc-table td { border-bottom: 1px solid var(--border); padding: 7px 10px; text-align: left; }
  .mc-table th { color: var(--muted); font-weight: 600; }
  .mc-table td.d { color: var(--muted); white-space: nowrap; }
  .mc-note { font-size: 12px; color: var(--muted); line-height: 1.9; }
  /* 参照系小字（分位 / 去年同期 / 历年同期均值）：比预期差更"绝对"的一层 */
  .mc-ref { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.7; border-top: 1px dashed var(--border); padding-top: 4px; }
  .mc-ref b { color: var(--text); font-weight: 600; }
  /* 📝 解读笔记（模型撰写层） */
  .mc-panel-note { border-color: #4a3f5f; }
  .note { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .note + .note { margin-top: 10px; }
  .note h4 { font-size: 14px; margin-bottom: 4px; }
  .note-meta { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .note-body { font-size: 13px; line-height: 1.9; }
  .note-body p { margin: 0 0 9px; }
  .note-body ul, .note-body ol { margin: 0 0 9px 20px; }
  .note-body li { margin-bottom: 3px; }
  .note-body b { color: var(--text); }
  .note-more { margin-top: 10px; }
  .note-more > summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  /* 🧭 当前宏观定性（置顶的"结论层"：先看结论，再看依据） */
  .mc-panel-regime { border-color: #6b5a2e; }
  .rg-now { font-size: 19px; font-weight: 700; line-height: 1.6; margin: 2px 0 6px; }
  .rg-meta { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }
  .rg-body { font-size: 13px; line-height: 1.9; }
  .rg-body p { margin: 0 0 9px; }
  .rg-body ul { margin: 0 0 9px 20px; }
  .rg-body li { margin-bottom: 3px; }
  .rg-body b { color: var(--text); }
  .mc-panel-regime code { font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) { .rg-now { font-size: 17px; } }
  /* 🏭 宏观 → 产业 传导 */
  .mc-ind td { vertical-align: top; line-height: 1.7; }
  .mc-ind .ind-name { width: 180px; }
  .mc-ind .ind-name a { text-decoration: none; }
  .mc-ind .ind-link { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.6; }
  .mc-ind .ind-state { width: 150px; font-weight: 600; white-space: nowrap; }
  .mc-ind .k-favorable { color: var(--green); }
  .mc-ind .k-unfavorable { color: var(--red); }
  .mc-ind .k-mixed { color: var(--muted); }
  .mc-ind .ind-drvs { font-size: 12.5px; }
  .mc-ind .ind-drv { margin-bottom: 5px; }
  .mc-ind .ind-drv:last-child { margin-bottom: 0; }
  .mc-ind .ind-note { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
  .mc-note b { color: var(--text); }
  /* 🧭 框架条件变量体检 */
  .mc-panel-cond { border-color: #3d4b5f; }
  .mc-cond td { vertical-align: top; line-height: 1.75; }
  .mc-cond .cond-name { width: 190px; }
  .mc-cond .cond-target { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .mc-cond .cond-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .mc-cond .cond-status { width: 250px; white-space: nowrap; font-weight: 600; }
  .mc-cond .cond-src { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 4px; white-space: normal; }
  .mc-cond .k-ok { color: var(--green); }
  .mc-cond .k-warn { color: #d29922; }
  .mc-cond .k-bad { color: var(--red); }
  .mc-cond .k-gap { color: var(--muted); }
  @media (max-width: 720px) {
    .mc-cond .cond-name, .mc-cond .cond-status { width: auto; white-space: normal; }
  }
  /* 预期差时间轴 */
  .sr-list { display: grid; gap: 6px; margin-top: 10px; }
  .sr-row { display: flex; align-items: center; gap: 12px; font-size: 12.5px; }
  .sr-label { width: 116px; flex-shrink: 0; color: var(--muted); white-space: nowrap; }
  .sr-bar { flex: 1; min-width: 120px; }
  .sr-bar svg { width: 100%; height: 16px; display: block; }
  .sr-val { width: 290px; flex-shrink: 0; text-align: right; color: var(--muted); }
  @media (max-width: 720px) {
    .sr-row { flex-wrap: wrap; }
    .sr-val { width: 100%; text-align: left; }
  }
</style>
</head>
<body>
<header class="top-bar">
  <div class="brand"><a href="/">📈 Stocks 研究站</a></div>
  <nav class="top-nav">
    <a href="/industries">🏭 产业地图</a>
    <a href="/articles">📖 文章</a>
    <a href="/smart-money">🧠 聪明钱</a>
    <a href="/macro" class="active">🧭 宏观</a>
  </nav>
  <div class="top-right">
    <span id="who"></span>
    <button id="theme-btn" class="btn-theme"></button>
    <button id="logout-btn" class="btn-ghost">退出</button>
  </div>
</header>
<main class="container">
  <h2>🧭 宏观环境 <span class="muted" id="mc-asof"></span></h2>
  <div id="mc-body"><p class="empty-sm">加载中…</p></div>
</main>
<script src="/assets/macro.js"></script>
<script src="/assets/theme.js"></script>
</body>
</html>
